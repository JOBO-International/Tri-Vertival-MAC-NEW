name: Mac-App bauen

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]   # später: amd64 für Intel-Macs ergänzen
    runs-on: macos-latest
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: programm/go.sum
      - name: Tri-Vertical.app bauen
        working-directory: programm
        run: |
          set -o pipefail
          bash -x baue_mac.sh 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
      - name: Fehlerprotokoll als Hinweis ausgeben
        if: failure()
        run: |
          python3 - <<'PY'
          import os,urllib.parse
          t=open(os.environ["GITHUB_WORKSPACE"]+"/build.log",errors="replace").read().splitlines()[-45:]
          m="\n".join(l[:300] for l in t)
          m=m.replace("%","%25").replace("\r","%0D").replace("\n","%0A")
          print("::error title=Buildlog::"+m)
          PY
      - name: ZIP erzeugen
        run: ditto -c -k --keepParent mac-build/Tri-Vertical.app Tri-Vertical-Mac-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Tri-Vertical-Mac-${{ matrix.arch }}
          path: Tri-Vertical-Mac-${{ matrix.arch }}.zip
